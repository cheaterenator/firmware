# trunk-ignore-all(checkov/CKV_GHA_7): fork-only manual publish inputs, not used upstream

name: Fork Docker Image

# Build the meshtasticd Docker image and push it to THIS repository's own
# GitHub Container Registry namespace (ghcr.io/<owner>/<repo>) - never to
# Docker Hub's meshtastic/meshtasticd. That target is hardcoded in
# docker_build.yml and requires the upstream project's own DOCKER_FIRMWARE_TOKEN,
# which this fork does not have and should not recreate (doing so would publish
# under the upstream project's name on a registry outside GitHub entirely).
#
# This intentionally does NOT call docker_build.yml, because that reusable
# workflow's push path is hardwired to the meshtastic/meshtasticd name on
# Docker Hub with no way to redirect it. Instead this uses the same toolchain
# (QEMU + Buildx + the repo's own Dockerfile/alpine.Dockerfile) but tags and
# pushes to your own GHCR namespace using only the automatic GITHUB_TOKEN - no
# extra secret needed.
#
# Manual-only (workflow_dispatch).

on:
  workflow_dispatch:
    inputs:
      distro:
        type: choice
        options:
          - debian
          - alpine
        default: debian
      platform:
        type: choice
        options:
          - linux/amd64
          - linux/arm64
        default: linux/amd64
        description: linux/amd64 runs natively on the build runner (fast). linux/arm64 cross-builds under QEMU (slow).
      pio_env:
        type: string
        default: native-tft
        description: PlatformIO environment to build inside the image (matches what CI validates).
      push:
        type: boolean
        default: true
        description: Push to ghcr.io under your own account. Turn off to just validate the build without publishing.

run-name: "Fork Docker: ${{ inputs.distro }}/${{ inputs.platform }} on ${{ github.repository }}"

concurrency:
  group: fork-docker-${{ github.repository }}-${{ inputs.distro }}-${{ inputs.platform }}
  cancel-in-progress: false

permissions: read-all

jobs:
  docker-build:
    if: github.repository_owner != 'meshtastic'
    runs-on: ${{ contains(inputs.platform, 'arm') && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write # Needed to push to this repo's own GHCR namespace.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Get release version string
        id: version
        run: echo "long=$(./bin/buildinfo.py long)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Docker setup
        uses: docker/setup-buildx-action@v4

      - name: Sanitize platform string
        id: sanitize_platform
        env:
          plat: ${{ inputs.platform }}
        run: echo "cleaned_platform=${plat}" | sed 's/\//_/g' >> "$GITHUB_OUTPUT"

      - name: GHCR login
        if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker tag
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ toLower(github.repository) }}
          tags: |
            fork-${{ steps.version.outputs.long }}-${{ inputs.distro }}-${{ steps.sanitize_platform.outputs.cleaned_platform }}
          flavor: latest=false

      - name: Docker build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: |
            ${{ inputs.distro == 'alpine' && './alpine.Dockerfile' || './Dockerfile' }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          platforms: ${{ inputs.platform }}
          build-args: |
            PIO_ENV=${{ inputs.pio_env }}
          cache-from: type=registry,ref=ghcr.io/${{ toLower(github.repository) }}-cache:fork-${{ inputs.distro }}-${{ steps.sanitize_platform.outputs.cleaned_platform }}
          cache-to: type=registry,ref=ghcr.io/${{ toLower(github.repository) }}-cache:fork-${{ inputs.distro }}-${{ steps.sanitize_platform.outputs.cleaned_platform }},mode=max,ignore-error=true

      - name: Summary
        if: ${{ inputs.push }}
        run: |
          echo "Pushed \`ghcr.io/${{ toLower(github.repository) }}:fork-${{ steps.version.outputs.long }}-${{ inputs.distro }}-${{ steps.sanitize_platform.outputs.cleaned_platform }}\`" >> "$GITHUB_STEP_SUMMARY"
