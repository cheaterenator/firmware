; DIY: generic ESP32-WROOM-32 DevKit + EBYTE E28-2G4M (Semtech SX1281, 2.4 GHz) module
; See README.md in this folder for the wiring diagram and bill of materials.
[env:sx1281-e28-diy]
extends = esp32_base
board = esp32doit-devkit-v1
board_level = extra
build_flags =
  ${esp32_base.build_flags}
  -D PRIVATE_HW
  -I variants/esp32/diy/sx1281_e28
