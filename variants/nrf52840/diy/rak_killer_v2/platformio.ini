; SuperMini nRF52840 + Heltec HT-RA62 + DIY Breakout PCB
[env:rak_killer_v2]
extends = nrf52840_base
board = promicro-nrf52840
board_level = extra
debug_tool = jlink


# add -DCFG_SYSVIEW if you want to use the Segger systemview tool for OS profiling.
build_flags = ${nrf52840_base.build_flags}
        -I variants/nrf52840/diy/rak_killer_v2
        -D PRIVATE_HW
        ;-D MAX_NUM_NODES=80
        ;-D HOP_RELIABLE=7
        -D MESHTASTIC_EXCLUDE_AUTO_REBOOT=0 ; re-enable, excluded globally in platformio.ini
        -D AUTO_REBOOT_INTERVAL_SECS=86400
        -D MESHTASTIC_EXCLUDE_PAXCOUNTER=1  
        -D MESHTASTIC_EXCLUDE_MESHBEACON=1
        -D MESHTASTIC_EXCLUDE_REMOTEHARDWARE=0
        -D MESHTASTIC_REMOTE_HARDWARE_PERSIST_GPIO=1

        -L "${platformio.libdeps_dir}/${this.__env__}/bsec2/src/cortex-m4/fpv4-sp-d16-hard"

build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/diy/rak_killer_v2>
lib_deps =
  ${nrf52840_base.lib_deps}

; Same hardware, heap-trimmed (see nrf52_promicro_diy-eco)
[env:rak_killer_v2-eco]
extends = env:rak_killer_v2
build_flags =
  ${env:rak_killer_v2.build_flags}
  -D MAX_NUM_NODES=80
  -D MESHTASTIC_EXCLUDE_ENVIRONMENTDB=1
  ; No GPS fitted: drop the GPS driver and its screens. Not MESHTASTIC_EXCLUDE_GPS - that also drops
  ; PositionModule, the only path that sets our clock from mesh position packets (time beacons).
  -D HAS_GPS=0
  ; Heap: .bss growth eats the heap arena 1:1. The nrf52840_base 4096 sizes two buffers each in
  ; Serial1, Serial2 and Wire (24 KB .bss) for a 115200-baud GPS; this build has no GPS, so go back
  ; to the pre-#8956 1024 (-18 KB .bss).
  -D SERIAL_BUFFER_SIZE=1024
  ; MQTT client-proxy pool is static whether or not MQTT runs (~508 B/slot): 16 -> 4 slots (-6 KB .bss)
  -D MAX_MQTT_PROXY_MESSAGES=4
build_unflags =
  ${nrf52840_base.build_unflags}
  -DSERIAL_BUFFER_SIZE=4096
