; Ikoka Stick variant for XIAO C3 433
[env:ikoka_c3_433]
extends = esp32c3_base
board = esp32-c3-devkitm-1
build_flags =
  ${esp32c3_base.build_flags}
  -D PRIVATE_HW
  -I variants/esp32c3/diy/ikoka_c3_433
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  ; UDP default-channel bridge to the 868 MHz NarrowFast mesh over the local network - see
  ; src/mesh/udp/UdpBridgePresets.h for the bridged preset list.
  -D UDP_PRESET_BRIDGE=1
board_level = extra
