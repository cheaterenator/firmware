; Ikoka Stick variant for XIAO C3
[env:ikoka_c3]
extends = esp32c3_base
board = esp32-c3-devkitm-1
build_flags =
  ${esp32c3_base.build_flags}
  -D PRIVATE_HW
  -I variants/esp32c3/diy/ikoka_c3
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D INA_CHARGING_DETECTION_INVERT
  -DENABLE_WIFI_OTA=ON
  ; C3 heap: lwIP and the Wi-Fi driver share it, and near 12 KB free an app connection kills Wi-Fi.
  ; 8 phone-queue slots (classic ESP32's value) instead of C3's 32 - 24 pooled packets, ~10.5 KB.
  -D MAX_RX_TOPHONE=8
  ; MQTT is off on this node; the proxy pool is 504 B per message.
  -D MAX_MQTT_PROXY_MESSAGES=2
  ; libpax keeps an 8 KB table in RAM even with the Paxcounter module disabled.
  -D MESHTASTIC_EXCLUDE_PAXCOUNTER=1
  -D MESHTASTIC_EXCLUDE_WEBSERVER=1
  ; UDP default-channel bridge to the 433 MHz LongFast mesh over the local network - see
  ; src/mesh/udp/UdpBridgePresets.h for the bridged preset list.
  ; -D UDP_PRESET_BRIDGE=1
  #-DMESHTASTIC_EXCLUDE_BEACON=1
	#-DMESHTASTIC_EXCLUDE_REPLYBOT=1
  #-DMESHTASTIC_EXCLUDE_TRAFFIC_MANAGEMENT=1
  #-DMESHTASTIC_EXCLUDE_ATAK=1
	#-DMESHTASTIC_EXCLUDE_REMOTEHARDWARE=1
custom_sdkconfig =
  ${esp32c3_base.custom_sdkconfig}
  ; Allocated from the heap at Wi-Fi init and never returned, ~1.6 KB each (default 8).
  CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM=4
  ; IDF recommends a BA window no larger than the static RX buffer count.
  CONFIG_ESP_WIFI_RX_BA_WIN=4
board_level = extra
