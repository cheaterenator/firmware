; Ikoka Stick variant for XIAO C6
[env:ikoka_c6]
extends = esp32c6_base
; Seeed's board also builds the XIAO_ESP32C6 core variant, whose initVariant() powers the
; Wi-Fi RF switch and selects the on-board ceramic antenna.
board = seeed_xiao_esp32c6
board_level = extra
build_flags =
  ${esp32c6_base.build_flags}
  -D PRIVATE_HW
  -I variants/esp32c6/diy/ikoka_c6
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  ; 4 MB flash: the C6 image overflows the 2.3 MB app slot with the OLED UI, so drop Codec2
  ; audio (as on the other C6 boards) and the web server (as on ikoka_c3).
  -D MESHTASTIC_EXCLUDE_AUDIO=1
  -D MESHTASTIC_EXCLUDE_WEBSERVER=1
  ; UDP default-channel bridge to the 433 MHz LongFast mesh over the local network - see
  ; src/mesh/udp/UdpBridgePresets.h for the bridged preset list.
  -D UDP_PRESET_BRIDGE=1
lib_ignore =
  ${esp32c6_base.lib_ignore}
  ESP32 Codec2
