; Ikoka Stick variant for XIAO S3 E22P
[env:ikoka_s3_e22p]
extends = esp32s3_base
board = seeed-xiao-s3
board_level = extra
board_build.partitions = default_8MB.csv
upload_protocol = esptool
upload_speed = 921600

build_flags = 
  ${esp32s3_base.build_flags}
  -D PRIVATE_HW
  -I variants/esp32s3/diy/ikoka_s3_e22p
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1

