; Ikoka Stick variant for XIAO S3 433
[env:ikoka_s3_433]
extends = esp32s3_base
board = seeed-xiao-s3
board_level = extra
board_build.partitions = default_8MB.csv
upload_protocol = esptool
upload_speed = 921600
build_flags = 
  ${esp32s3_base.build_flags}
  -D PRIVATE_HW
  -I variants/esp32s3/diy/ikoka_s3_433
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  ; UDP default-channel bridge to the 868 MHz NarrowFast mesh over the local network - see
  ; src/mesh/udp/UdpBridgePresets.h for the bridged preset list.
  -D UDP_PRESET_BRIDGE=1
